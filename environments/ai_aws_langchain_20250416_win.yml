#   $ conda env export > ./environments/ai_aws_langchain_20250416_win.lock.yml
#   Ensure that the locked file has name = ai_aws_langchain_20250416_win and delete the prefix at the end.

# conda env --no-builds export > ./environments/ai_aws_langchain_20250416_win.lock.yml

